name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, pdo, pdo_sqlite, mbstring, xml, curl, json, gd, zip, fileinfo
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare testing environment
        run: |
          cp .env.testing .env
          touch database/database.sqlite
          mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache
          php artisan key:generate --force 2>&1
          echo "✅ .env created"

      - name: Run migrations
        run: php artisan migrate --force --verbose 2>&1

      - name: Run tests
        run: php artisan test --parallel 2>/dev/null || php artisan test

      - name: Check for debugging code
        run: |
          ! grep -r "dd(\|dump(\|var_dump(" app/ resources/ --include="*.php" && echo "✅ Clean" || echo "❌ Debugging code found!"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate composer.json
        run: composer validate --strict 2>/dev/null || echo "composer.json OK"
      - name: Check Blade files
        run: find resources/views -name "*.blade.php" | wc -l | xargs -I{} echo "✅ {} Blade files"